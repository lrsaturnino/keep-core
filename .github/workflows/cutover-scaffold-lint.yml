name: Cutover Scaffold Lint

# The unconditional gate on the cutover rehearsal scaffold itself.
#
# The scaffold's checkers — the source-binding verifier and the
# evidence-record validator — decide what may be accepted as release
# evidence, but everything that exercises them lives in a manually
# dispatched workflow. Nothing therefore proved a change to them until
# somebody remembered to dispatch a rehearsal. This job runs on every push
# and pull request that touches those files: shell syntax, ShellCheck,
# actionlint over the scaffold's own workflows, both validator self-tests,
# and the check holding the verifier's hand-written build-context
# classification to the rules .dockerignore really carries. It is
# deliberately cheap — no Docker image build, no Go test suite — so it can be
# required without slowing anything down.
#
# The path filters cover the scaffold plus the build inputs its trust model
# is derived from, because those decide what it accepts just as directly as
# its own code does: the build's ignore rules are what the verifier's context
# classification mirrors, the gitignore rules decide which working-tree paths
# count as divergence at all, and the Dockerfile and Makefile define the
# regeneration the verifier restores over rather than trusts. A change to any
# of them can widen what an image tree is allowed to be missing without
# touching a line under scripts/.
#
# Both ignore files the build could read are listed. Adding a
# Dockerfile-specific one retires every rule in the root .dockerignore for
# this build, which rewrites the whole context classification without
# touching the file the classification used to be derived from.
#
# These lists are not maintained by hand: shell-analysis resolves the
# Dockerfile the rehearsal workflow's build step really compiles and requires
# both lists below to cover it, the ignore file its name selects, the root
# .dockerignore, and both workflows. Moving the build onto another Dockerfile
# without moving these entries with it fails that check — the entries are
# what makes this gate run when those files change at all.

on:
  push:
    branches:
      - main
    # Kept in step with the pull_request list below; the workflow parser has
    # no anchors, so the two are written out.
    paths:
      - "scripts/release/pr4109/**"
      - ".github/workflows/cutover-rehearsal.yml"
      - ".github/workflows/cutover-scaffold-lint.yml"
      - ".dockerignore"
      - "Dockerfile.dockerignore"
      - ".gitignore"
      - "**/.gitignore"
      - "Dockerfile"
      - "Makefile"
  pull_request:
    paths:
      - "scripts/release/pr4109/**"
      - ".github/workflows/cutover-rehearsal.yml"
      - ".github/workflows/cutover-scaffold-lint.yml"
      - ".dockerignore"
      - "Dockerfile.dockerignore"
      - ".gitignore"
      - "**/.gitignore"
      - "Dockerfile"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The source-binding self-test builds throwaway repositories and reads
      # this checkout's history; the evidence-validator self-test drives the
      # real validation stage over fixture records.
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Analyze the rehearsal scaffold
        run: |
          mkdir -p ${{ github.workspace }}/rehearsal-evidence
          EVIDENCE_DIR=${{ github.workspace }}/rehearsal-evidence \
            ./scripts/release/pr4109/rehearse.sh shell-analysis

      - name: Upload scaffold-lint evidence
        # A failing analyzer's log is the output most needed for diagnosis.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cutover-scaffold-lint-${{ github.sha }}
          path: rehearsal-evidence/
          if-no-files-found: error
