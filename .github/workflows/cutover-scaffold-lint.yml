name: Cutover Scaffold Lint

# The unconditional gate on the cutover rehearsal scaffold itself.
#
# The scaffold's checkers — the source-binding verifier and the
# evidence-record validator — decide what may be accepted as release
# evidence, but everything that exercises them lives in a manually
# dispatched workflow. Nothing therefore proved a change to them until
# somebody remembered to dispatch a rehearsal. This job runs on every push
# and pull request that touches those files: shell syntax, ShellCheck,
# actionlint over the scaffold's own workflows, both validator self-tests,
# and the check holding the verifier's hand-written build-context
# classification to the rules .dockerignore really carries. It is
# deliberately cheap — no Docker image build, no Go test suite — so it can be
# required without slowing anything down.
#
# The path filters cover the scaffold plus the build inputs its trust model
# is derived from, because those decide what it accepts just as directly as
# its own code does: the build's ignore rules are what the verifier's context
# classification mirrors, the gitignore rules decide which working-tree paths
# count as divergence at all, and the Dockerfile and Makefile define the
# regeneration the verifier restores over rather than trusts. A change to any
# of them can widen what an image tree is allowed to be missing without
# touching a line under scripts/.
#
# Both ignore files the build could read are listed. Adding a
# Dockerfile-specific one retires every rule in the root .dockerignore for
# this build, which rewrites the whole context classification without
# touching the file the classification used to be derived from.
#
# These lists are not maintained by hand, and are not trusted by inspection:
# shell-analysis enumerates the inputs out of the commit itself — the three
# workflows, the Dockerfile the rehearsal workflow's build step really
# compiles, the ignore file that name selects, the root .dockerignore, every
# file under the scaffold directory, and every committed .gitignore and
# Makefile — and requires both lists below to run on each one. It reads them
# the way the workflow parser does, last matching entry winning, so an entry
# listed here and negated further down is not coverage either. Moving the
# build onto another Dockerfile, or adding a gen/ Makefile, without moving
# these entries with it fails that check.
#
# contracts-ecdsa.yml is listed for the same reason: the contracts stage's
# evidence claims to reproduce one of its jobs, and shell-analysis holds both
# that stage and the rehearsal workflow's own setup-node to the Node release
# that job pins. A bump there touches no line under scripts/ and would
# otherwise leave the claim standing over a run that no longer reproduces it.
#
# The pull_request trigger carries no branches or types restriction on
# purpose, and shell-analysis refuses one: push fires only after a branch has
# already moved, so the pull_request event is the only one that can stop a
# change to these inputs from merging unchecked, and every restriction of it
# exempts some pull request from the gate.
#
# The analysis step below is likewise read rather than found. shell-analysis
# requires it in a step's run: body — the only key that runs anything — as that
# body's last command, unconditioned, unexcused, under the runner's own shell,
# and with nothing around it that could swallow what it says. Keep the step's
# shell to plain commands: a pipeline, a `|| true`, a shell `if`, a `set` line,
# a `shell:` naming another interpreter, or a step that merely prints this
# command all fail the gate closed rather than quietly retiring it.
#
# What none of that can prove is that this workflow ran, because the check
# lives behind the invocation it is checking. scaffold-lint MUST therefore be a
# required status check on the protected branches; without that setting a
# commit deleting this file deletes its own enforcement. See
# scripts/release/pr4109/README.md.

on:
  push:
    branches:
      - main
    # Kept in step with the pull_request list below; the workflow parser has
    # no anchors, so the two are written out.
    paths:
      - "scripts/release/pr4109/**"
      - ".github/workflows/cutover-rehearsal.yml"
      - ".github/workflows/cutover-scaffold-lint.yml"
      - ".github/workflows/contracts-ecdsa.yml"
      - ".dockerignore"
      - "Dockerfile.dockerignore"
      - ".gitignore"
      - "**/.gitignore"
      - "Dockerfile"
      - "Makefile"
      - "**/Makefile"
  pull_request:
    paths:
      - "scripts/release/pr4109/**"
      - ".github/workflows/cutover-rehearsal.yml"
      - ".github/workflows/cutover-scaffold-lint.yml"
      - ".github/workflows/contracts-ecdsa.yml"
      - ".dockerignore"
      - "Dockerfile.dockerignore"
      - ".gitignore"
      - "**/.gitignore"
      - "Dockerfile"
      - "Makefile"
      - "**/Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The source-binding self-test builds throwaway repositories and reads
      # this checkout's history; the evidence-validator self-test drives the
      # real validation stage over fixture records.
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Analyze the rehearsal scaffold
        run: |
          mkdir -p ${{ github.workspace }}/rehearsal-evidence
          EVIDENCE_DIR=${{ github.workspace }}/rehearsal-evidence \
            ./scripts/release/pr4109/rehearse.sh shell-analysis

      - name: Upload scaffold-lint evidence
        # A failing analyzer's log is the output most needed for diagnosis.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cutover-scaffold-lint-${{ github.sha }}
          path: rehearsal-evidence/
          if-no-files-found: error
