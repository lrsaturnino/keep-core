name: Cutover Rehearsal

# Manually dispatched driver for the single-release cutover rehearsal
# scaffold. Every dispatch runs the repository-local Go proofs of the cutover
# gate inside the same build image the client CI uses, the immutable-version
# static analyzers, and the ECDSA contracts build/test, self-tests the
# source-binding and evidence-record validators, validates any produced
# evidence records against the evidence schema, and archives each stage's
# log for the dispatched SHA. The container rehearsal stages run only when
# explicitly requested with the immutable image digests and the rehearsal
# chain inputs, and each one names the exact input it is missing and reports
# BLOCKED — a failed job — rather than running partially, because a rehearsal
# that cannot execute must never look green.
#
# Provenance is fail-closed: every proof stage receives the dispatched SHA
# in PR4109_EXPECTED_SOURCE_COMMIT and refuses to produce evidence unless
# the tree it is about to test is exactly that commit. For the build-image
# stage the checkout's .git and scripts/ are mounted read-only into the
# container (.dockerignore keeps both out of the build context), so the
# verification happens against the very bytes inside the image, not just
# the runner checkout. Stage logs are archived even when a stage fails — a
# red run's evidence is the most valuable kind.
#
# What the release was built into travels the other way. The reviewed manifest
# names the cutover; it cannot name the commit finally built or the immutable
# image digests, because those are outputs of a build over its own bytes. A
# release dispatch supplies them as a detached document in
# release_provenance_b64, which is decoded outside the checkout, mounted into
# the proof container, sealed into the receipt by the producer after the
# binary verifies it against the manifest, and required to be there — as the
# document that was supplied — before the receipt is archived. The container
# job checks the receipt it downloads for the same pairing before it pulls an
# image, so a release-ready receipt that names no artifact is refused at the
# dispatch boundary rather than after a fleet has run every mandatory step.

on:
  workflow_dispatch:
    inputs:
      artifact_environment:
        description: "npm dist-tag or exact version for the contract artifacts baked into the build image; forensic only — the proof stage restores every regenerated tracked file byte-exact from the dispatched SHA before testing, and the stamp records every resolved tarball's name, version, and sha256"
        required: false
        default: "development"
      run_container_stages:
        description: "Run the container rehearsal stages (needs all inputs below)"
        type: boolean
        required: false
        default: false
      prior_image_digest:
        description: "Immutable prior-production runtime digest (repo@sha256:...)"
        required: false
      r1_image_digest:
        description: "Immutable R1 candidate runtime digest (repo@sha256:...)"
        required: false
      probe_image_digest:
        description: "Immutable digest of the wget-carrying probe image every evidence reading is scraped with (repo@sha256:...); a mutable tag would leave the reading instrument outside the record's provenance"
        required: false
      eth_ws_url:
        description: "Rehearsal chain websocket endpoint"
        required: false
      eth_rpc_url:
        description: "The same chain's JSON-RPC endpoint. Every transaction a work driver reports is confirmed against it — mined, successful, and no later than the anchor claimed for the work it started — because an unconfirmed report is the driver's own account of itself"
        required: false
      cutover_block:
        description: "Rehearsed cutover block C on that chain"
        required: false
      chain_id:
        description: "Numeric chain id of that rehearsal chain"
        required: false
      bitcoin_network:
        description: "Bitcoin network the rollback state audit reconciles against (e.g. testnet)"
        required: false
      prior_version:
        description: "Release version the prior digest carries, as the rollback state audit must find it recorded"
        required: false
      prior_revision:
        description: "Source revision the prior digest carries, as the rollback state audit must find it recorded"
        required: false
      release_provenance_b64:
        description: "base64 of the detached release provenance: the commit built and the immutable per-platform image digests, generated after the release build and never committed to the tree it describes. Required for any dispatch whose reviewed manifest is release-ready — acceptance refuses records measured against a release that names no artifact — and legitimately empty on development dispatches"
        required: false

permissions:
  contents: read

jobs:
  local-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the checkout to the dispatched SHA so a branch moving
          # between dispatch and run cannot change what is tested.
          ref: ${{ github.sha }}
          # Fetch the whole history for the `git describe` command to work.
          fetch-depth: 0

      - name: Resolve versions
        run: |
          echo "version=$(git describe --tags --match "v[0-9]*" HEAD)" >> "$GITHUB_ENV"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The binding verifier gates every piece of evidence this workflow
      # archives, so it proves itself before the expensive image build: the
      # self-test drives it through checkout- and image-shaped trees and
      # fails the dispatch if the verifier accepts anything beyond the
      # image's documented construction.
      - name: Self-test the source binding verifier
        run: ./scripts/release/pr4109/test-source-binding.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-rehearsal-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ENVIRONMENT names the artifact input identity explicitly instead of
      # riding the Makefile's implicit development default (client CI's
      # empty build-arg resolves to the same tag). The tag can float on the
      # registry, but nothing tested depends on it: the in-image
      # verification restores every regenerated tracked file byte-exact
      # from the dispatched commit before the proofs compile, and records
      # the resolved tarballs — name, exact version, sha256 — in the
      # archived stamp as the image build's own input identity.
      - name: Build Docker Build Image
        uses: docker/build-push-action@v5
        with:
          target: build-docker
          tags: go-build-env
          build-args: |
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
            ENVIRONMENT=${{ inputs.artifact_environment }}
          load: true # load image to local registry to use it in next steps
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          context: .

      # The half of the release identity the reviewed manifest cannot state
      # about itself: the commit finally built and the immutable per-platform
      # image digests are outputs of a build over the manifest's own bytes, so
      # recording them in the tree would require the tree to contain a hash of
      # itself. They live in a detached document generated after the build,
      # and this is where a release dispatch hands it to the proof stage.
      #
      # It lands in RUNNER_TEMP rather than the workspace for the same reason
      # every other provisioned input does: the proof stage refuses to produce
      # evidence from a tree that diverges from the dispatched commit,
      # untracked files included, so a provenance document written into the
      # checkout would fail the very check it exists to satisfy.
      #
      # A development dispatch supplies none and still runs everything. The
      # receipt then carries no provenance, which the acceptance stage refuses
      # only once the reviewed manifest is release-ready — that refusal is
      # acceptance's to make, not this step's.
      - name: Provision the detached release provenance
        env:
          RELEASE_PROVENANCE_B64: ${{ inputs.release_provenance_b64 }}
        run: |
          if [ -z "$RELEASE_PROVENANCE_B64" ]; then
            echo "no detached release provenance supplied; the receipt will" \
              "carry none, and acceptance refuses records measured against a" \
              "release-ready manifest without it"
            exit 0
          fi
          path="$RUNNER_TEMP/release-provenance.json"
          printf '%s' "$RELEASE_PROVENANCE_B64" | base64 -d >"$path"
          # Only that a document arrived at all. What it has to say is the
          # binary's to judge inside the container, but a mis-pasted input is
          # named here rather than surfacing as an unreadable file in a stage
          # whose log nobody reads on the way to a red run.
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
            "$path" || {
            echo "the supplied release_provenance_b64 does not decode to" >&2
            echo "readable JSON; supply the base64 of the provenance" >&2
            echo "document generated after the release build" >&2
            exit 1
          }
          echo "RELEASE_PROVENANCE_FILE=$path" >>"$GITHUB_ENV"
          echo "provisioned the detached release provenance"

      - name: Run cutover gate local proofs
        run: |
          mkdir -p ${{ github.workspace }}/rehearsal-evidence
          # Mounted at the container root, not under the working directory:
          # the stage verifies the image's own source tree against the
          # dispatched SHA before producing evidence, and a document inside
          # that tree would be an untracked file failing that check.
          provenance_mount=()
          if [ -n "${RELEASE_PROVENANCE_FILE:-}" ]; then
            provenance_mount=(
              -v "$RELEASE_PROVENANCE_FILE:/release-provenance.json:ro"
              -e PR4109_RELEASE_PROVENANCE=/release-provenance.json
            )
          fi
          # .dockerignore keeps scripts/ and .git out of the build context,
          # so both are mounted read-only from the dispatched checkout: the
          # stage script runs at the dispatched revision, and rehearse.sh
          # verifies the image's own source tree against the dispatched SHA
          # before producing any evidence. safe.directory is required
          # because the mounted metadata is owned by the runner user, not
          # the container's root.
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            -v ${{ github.workspace }}/rehearsal-evidence:/rehearsal-evidence \
            -v ${{ github.workspace }}/.git:/go/src/github.com/keep-network/keep-core/.git:ro \
            -v ${{ github.workspace }}/scripts:/go/src/github.com/keep-network/keep-core/scripts:ro \
            -e EVIDENCE_DIR=/rehearsal-evidence \
            -e PR4109_EXPECTED_SOURCE_COMMIT=${{ github.sha }} \
            -e PR4109_SOURCE_BINDING_MODE=build-image \
            "${provenance_mount[@]}" \
            go-build-env \
            bash -c 'git config --global --add safe.directory \
              /go/src/github.com/keep-network/keep-core && \
              exec ./scripts/release/pr4109/rehearse.sh local-proofs'

      # The receipt is what the container job downloads and every record it
      # produces is measured against, so a supplied provenance has to have
      # survived into it — and be the document that was supplied, byte for
      # byte. Without this a release dispatch could archive a receipt
      # acceptance refuses while this job stayed green, and the only account
      # of why would be a line in a log read by nobody on a passing run.
      - name: Require the receipt to carry the supplied provenance
        run: |
          if [ -z "${RELEASE_PROVENANCE_FILE:-}" ]; then
            echo "no provenance was supplied to this dispatch; nothing to" \
              "require of the receipt"
            exit 0
          fi
          recorded="${{ github.workspace }}/rehearsal-evidence/attestation/release-provenance.json"
          if [ ! -f "$recorded" ]; then
            echo "the local proofs recorded no detached release provenance" >&2
            echo "although this dispatch supplied one; the archived receipt" >&2
            echo "cannot admit container evidence for a release-ready" >&2
            echo "manifest" >&2
            exit 1
          fi
          if ! cmp -s "$RELEASE_PROVENANCE_FILE" "$recorded"; then
            echo "the provenance recorded in the receipt is not the document" >&2
            echo "this dispatch supplied and the binary verified" >&2
            exit 1
          fi
          echo "the archived receipt carries the supplied release provenance"

      # The evidence validator's own self-test already ran unconditionally
      # inside the local-proofs stage above (its verdicts are part of the
      # archived local-proofs.log), so a record-free dispatch still proves
      # the validator; this step validates whatever records a dispatch
      # actually produced. The manifest attestation this stage requires was
      # written by local-proofs into the same bind-mounted evidence
      # directory, one level down, so it is here and it does not make the
      # top-level record probe below see a record that does not exist.
      #
      # The dispatched SHA is handed to this stage like to every other proof
      # stage: the manifest, schema, and comparison rules it judges records
      # by come out of this checkout, and the attestation and every record it
      # accepts must name that same commit. Without the binding a receipt
      # produced at one commit would admit records claiming another whenever
      # the manifest bytes did not change between them.
      - name: Validate evidence records against the schema
        env:
          PR4109_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if compgen -G "${{ github.workspace }}/rehearsal-evidence/*.json" > /dev/null; then
            EVIDENCE_DIR=${{ github.workspace }}/rehearsal-evidence \
              ./scripts/release/pr4109/rehearse.sh validate-evidence
          else
            echo "no JSON evidence records produced by this dispatch;" \
              "the evidence-validator self-test ran inside the local-proofs stage"
          fi

      - name: Upload rehearsal evidence
        # A failing proof stage's log is the evidence most needed for
        # diagnosis, so archive whatever was produced even on failure.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-evidence-${{ github.sha }}
          path: rehearsal-evidence/
          if-no-files-found: warn

  static-analysis:
    # Mirrors the client CI analyzer jobs' Go setup; the stage itself pins
    # every analyzer to an immutable version so the archived log is
    # reproducible evidence for this exact SHA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run the immutable-version static analyzers
        env:
          PR4109_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p ${{ github.workspace }}/rehearsal-evidence
          EVIDENCE_DIR=${{ github.workspace }}/rehearsal-evidence \
            ./scripts/release/pr4109/rehearse.sh static-analysis

      - name: Upload static-analysis evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-evidence-${{ github.sha }}
          path: rehearsal-evidence/
          if-no-files-found: error

  solidity-proofs:
    # Mirrors contracts-ecdsa.yml's contracts-build-and-test job: exactly
    # Node 18.15.0 (18.16+ produced broken hardhat compile artifacts) and
    # the shared Corepack/immutable-install action, then the stage
    # revalidates the install and runs the same build and test commands.
    #
    # The version below is not maintained by hand: shell-analysis reads the
    # release that job pins and fails unless this one matches, and the stage
    # itself blocks on any other interpreter. Bumping CI without bumping
    # this line is caught by a lint, not by a dispatch nobody ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "18.15.0"

      - uses: ./.github/actions/install-yarn-deps
        with:
          working-directory: ./solidity/ecdsa

      - name: Build and test the ECDSA contracts surface
        env:
          PR4109_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p ${{ github.workspace }}/rehearsal-evidence
          EVIDENCE_DIR=${{ github.workspace }}/rehearsal-evidence \
            ./scripts/release/pr4109/rehearse.sh solidity-proofs

      - name: Upload solidity-proofs evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solidity-proofs-evidence-${{ github.sha }}
          path: rehearsal-evidence/
          if-no-files-found: error

  container-rehearsal:
    # The container stages need the immutable digests, a rehearsal chain, the
    # per-node keys/configs, and the chain-side programs no repository can
    # derive — the driver that originates protocol work, and the generator that
    # produces the reconciliation, quiescence, and prior-reader evidence the
    # rollback audit binds its verdict to, for the snapshot the drain leaves.
    # Everything the runner can be given is given below; anything still missing
    # reports BLOCKED (exit 3) naming the exact input, which is the truthful
    # status for a rehearsal that cannot execute.
    if: inputs.run_container_stages
    needs: local-proofs
    runs-on: ubuntu-latest
    env:
      PRIOR_IMAGE_DIGEST: ${{ inputs.prior_image_digest }}
      R1_IMAGE_DIGEST: ${{ inputs.r1_image_digest }}
      PROBE_IMAGE_DIGEST: ${{ inputs.probe_image_digest }}
      ETH_WS_URL: ${{ inputs.eth_ws_url }}
      ETH_RPC_URL: ${{ inputs.eth_rpc_url }}
      CUTOVER_BLOCK: ${{ inputs.cutover_block }}
      CHAIN_ID: ${{ inputs.chain_id }}
      KEEP_ETHEREUM_PASSWORD: ${{ secrets.REHEARSAL_KEEP_ETHEREUM_PASSWORD }}
      PR4109_BITCOIN_NETWORK: ${{ inputs.bitcoin_network }}
      PR4109_PRIOR_VERSION: ${{ inputs.prior_version }}
      PR4109_PRIOR_REVISION: ${{ inputs.prior_revision }}
      # The container stages verify their own source binding before they emit
      # or judge a record, exactly like every other proof stage.
      PR4109_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
      EVIDENCE_DIR: ${{ github.workspace }}/rehearsal-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Every provisioned input lands outside the checkout. The container
      # stages refuse to produce evidence from a tree that diverges from the
      # dispatched commit — untracked files included — so a keystore or an
      # input bundle unpacked into the workspace would fail the very stage it
      # exists to enable. The one exception is the evidence directory, which
      # the commit's own .gitignore covers.
      - name: Resolve the provisioning paths
        run: |
          {
            echo "KEYSTORE_DIR=$RUNNER_TEMP/rehearsal-keystore"
            echo "REHEARSAL_INPUTS_DIR=$RUNNER_TEMP/rehearsal-inputs"
            echo "PR4109_WORK_DRIVER=$RUNNER_TEMP/rehearsal-inputs/work-driver"
            # An executable, not a bundle of records: every rollback evidence
            # record must name the aggregate checksum of the snapshot it speaks
            # for, and that snapshot does not exist until this run has drained
            # the fleet and copied its state out. A bundle unpacked here could
            # not know a checksum computed later, and one that carried it
            # anyway would be describing a drain that had not happened.
            echo "PR4109_ROLLBACK_EVIDENCE_GENERATOR=$RUNNER_TEMP/rehearsal-inputs/rollback-evidence-generator"
            # Not a program at all: the archived independent cryptographic
            # review of the dependency revision go.mod resolves. It gates
            # acceptance of a single-release record rather than execution of
            # any step, so it is optional here and the step below unsets this
            # path when the bundle carries no such record — a rehearsal
            # without it still runs everything and simply produces a record
            # acceptance refuses.
            echo "PR4109_TSSLIB_REVIEW=$RUNNER_TEMP/rehearsal-inputs/tsslib-review"
            # Written to, not read from: the rollback stage captures each
            # drained node's state here straight out of the container it
            # stopped. It holds live protocol state — key shares included —
            # so it stays on the runner and is never archived. What a reviewer
            # reads is the audit manifest each capture produces, which the
            # stage writes into the evidence directory.
            echo "STORAGE_SNAPSHOT_DIR=$RUNNER_TEMP/rehearsal-snapshots"
          } >> "$GITHUB_ENV"

      # The per-node keys and configurations come from one repository secret
      # holding a base64-encoded tar.gz with a <service>/config.toml plus key
      # material per rehearsal node — rehearsal-only throwaway keys, never
      # production material. Without it the stage reports BLOCKED with the
      # exact missing input instead of failing preflight opaquely.
      - name: Provision the rehearsal keystore bundle
        env:
          REHEARSAL_KEYSTORE_BUNDLE_B64: ${{ secrets.REHEARSAL_KEYSTORE_BUNDLE_B64 }}
        run: |
          if [ -z "$REHEARSAL_KEYSTORE_BUNDLE_B64" ]; then
            echo "BLOCKED: the REHEARSAL_KEYSTORE_BUNDLE_B64 secret is not" >&2
            echo "provisioned; store a base64-encoded tar.gz holding one" >&2
            echo "<service>/config.toml and rehearsal-only key material per" >&2
            echo "node, then re-dispatch" >&2
            exit 3
          fi
          mkdir -p "$KEYSTORE_DIR"
          printf '%s' "$REHEARSAL_KEYSTORE_BUNDLE_B64" \
            | base64 -d \
            | tar -xz -C "$KEYSTORE_DIR"
          chmod -R go-rwx "$KEYSTORE_DIR"
          echo "provisioned $(find "$KEYSTORE_DIR" -mindepth 1 -maxdepth 1 \
            -type d | wc -l | tr -d ' ') rehearsal node directories"

      # The inputs that exist outside this repository entirely, and both of
      # them are programs rather than data. The fleet only reacts to chain
      # events, so without a driver no ceremony exists to observe. The rollback
      # audit reports namespace consistency and nothing about rollback safety
      # unless it is given the live-chain and Bitcoin reconciliations, the
      # node's own quiescence outcome, and the prior release's
      # reader-compatibility result — and each of those must name the exact
      # snapshot it speaks for, which is state this run produces by draining
      # the fleet. So the generator is provisioned and executed after each
      # capture instead of a bundle of records being unpacked before the fleet
      # starts. Both are checked here rather than at the point of use, so a
      # bundle missing one blocks before the fleet is started instead of
      # halfway through a rehearsal.
      #
      # The secret is mutable and both programs produce readings that become
      # release evidence, so an executable bit is not provenance. The bytes are
      # hashed against scripts/release/pr4109/chain-inputs.sha256 — a reviewed,
      # checked-in control — in the rehearsal's own preflight, before any node
      # is started, and the digests are recorded into the evidence document.
      # This step therefore establishes only that the bundle arrived with both
      # members; the binding is the rehearsal's, because it is the party that
      # runs them.
      - name: Provision the rehearsal chain inputs bundle
        env:
          REHEARSAL_CHAIN_INPUTS_BUNDLE_B64: ${{ secrets.REHEARSAL_CHAIN_INPUTS_BUNDLE_B64 }}
        run: |
          if [ -z "$REHEARSAL_CHAIN_INPUTS_BUNDLE_B64" ]; then
            echo "BLOCKED: the REHEARSAL_CHAIN_INPUTS_BUNDLE_B64 secret is" >&2
            echo "not provisioned; store a base64-encoded tar.gz holding" >&2
            echo "work-driver (executable, called with the phase name) and" >&2
            echo "rollback-evidence-generator (executable, called with the" >&2
            echo "service name, that node's identity audit manifest, and an" >&2
            echo "output directory to write the four rollback evidence" >&2
            echo "records into), optionally tsslib-review (the archived" >&2
            echo "independent cryptographic review of the dependency" >&2
            echo "revision go.mod resolves, which gates acceptance rather" >&2
            echo "than execution), record each member's reviewed SHA-256 in" >&2
            echo "scripts/release/pr4109/chain-inputs.sha256, then" >&2
            echo "re-dispatch" >&2
            exit 3
          fi
          mkdir -p "$REHEARSAL_INPUTS_DIR"
          printf '%s' "$REHEARSAL_CHAIN_INPUTS_BUNDLE_B64" \
            | base64 -d \
            | tar -xz -C "$REHEARSAL_INPUTS_DIR"
          chmod -R go-rwx "$REHEARSAL_INPUTS_DIR"

          missing=""
          for member in \
            "$PR4109_WORK_DRIVER" \
            "$PR4109_ROLLBACK_EVIDENCE_GENERATOR"; do
            [ -x "$member" ] || missing="$missing $member(executable)"
          done
          if [ -n "$missing" ]; then
            echo "BLOCKED: the chain inputs bundle is missing:$missing" >&2
            exit 3
          fi
          echo "provisioned the work driver and the rollback evidence generator"

          # The review record is an acceptance input, so its absence is not a
          # provisioning failure: the rehearsal runs every step either way.
          # The path is cleared rather than left dangling, because a variable
          # naming a file that is not there is a supplied record the
          # rehearsal cannot read, and that does block.
          if [ -f "$PR4109_TSSLIB_REVIEW" ]; then
            echo "provisioned the archived dependency review record"
          else
            echo "PR4109_TSSLIB_REVIEW=" >> "$GITHUB_ENV"
            echo "no dependency review record in the bundle; every step will" \
              "run and the emitted single-release record will not be" \
              "acceptable until one is supplied and pinned"
          fi

      # The records these stages emit are measured against the compiled bounds
      # the local-proofs stage attested at this same commit, and that receipt
      # lives in that job's evidence artifact. Without it here every rehearsal
      # blocks at its own emitter, which is the one failure mode a dispatch
      # cannot diagnose from the log it archives.
      - name: Restore the release-manifest attestation
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-evidence-${{ github.sha }}
          path: ${{ github.workspace }}/rehearsal-evidence

      - name: Require the attestation these records are measured against
        run: |
          dir="$EVIDENCE_DIR/attestation"
          for part in derived-manifest.json reviewed-manifest.sha256 \
            source-commit.txt release-ready.txt; do
            if [ ! -f "$dir/$part" ]; then
              echo "BLOCKED: the local-proofs attestation did not arrive:" >&2
              echo "$dir/$part is absent, so nothing here proves the" >&2
              echo "reviewed release manifest still matches the compiled" >&2
              echo "bounds these records would be judged by" >&2
              exit 3
            fi
          done

          # A receipt recording a release-ready manifest is a
          # release-acceptance receipt, and acceptance refuses one that names
          # no artifact. Asked here, against the receipt this job actually
          # downloaded and before an image is pulled or a node started,
          # because the alternative is a rehearsal that drives a fleet through
          # every mandatory step and is then refused at its own emitter for an
          # input the dispatch could have been given.
          if [ "$(tr -d '[:space:]' <"$dir/release-ready.txt")" = "yes" ] &&
            [ ! -f "$dir/release-provenance.json" ]; then
            echo "BLOCKED: the restored receipt records a release-ready" >&2
            echo "manifest and carries no detached release provenance, so" >&2
            echo "every record this rehearsal could produce would be" >&2
            echo "measured against a release nothing identifies;" >&2
            echo "re-dispatch with release_provenance_b64 set to the" >&2
            echo "provenance generated after the release build" >&2
            exit 3
          fi
          echo "attestation restored for source $(cat "$dir/source-commit.txt")"

      - name: Preflight the rehearsal inputs
        id: preflight
        run: ./scripts/release/pr4109/rehearse.sh preflight

      - name: Exact-image single-release rehearsal
        id: single_release
        run: ./scripts/release/pr4109/rehearse.sh single-release

      # The cutover fleet stops before the rollback gate starts, and it stops
      # here as well as inside the stage that owns it: a single-release stage
      # that failed halfway never reached its own closing step, and the fleet
      # it left behind is a release candidate watching the same rehearsal chain
      # the rollback gate is about to declare quiet. The rollback stage
      # enumerates the daemon and refuses to release the prior binary while any
      # candidate is still attached to a network, so this step is what keeps
      # that refusal from being the normal outcome rather than what establishes
      # the barrier. Volumes stay: the state the drained fleet left is evidence.
      - name: Stop the cutover fleet before the rollback gate
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: |
          docker compose --project-name pr4109-single_release \
            --file ./scripts/release/pr4109/compose.rehearsal.yaml \
            stop || true

      # A refused cutover rehearsal is exactly when the rollback gate's
      # evidence matters most, so it runs on the cutover's verdict being
      # anything at all. Only a failed preflight stops it: that means the
      # inputs never validated, and a rollback rehearsal on unvalidated inputs
      # would produce a record about nothing.
      - name: Homogeneous rollback rehearsal
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: ./scripts/release/pr4109/rehearse.sh rollback

      # Both projects, whatever happened above: a rehearsal that failed
      # mid-fleet otherwise leaves nodes running and volumes holding live
      # protocol state on the runner.
      - name: Tear down the rehearsal fleets
        if: ${{ always() }}
        run: |
          for gate in single_release rollback; do
            docker compose --project-name "pr4109-$gate" \
              --file ./scripts/release/pr4109/compose.rehearsal.yaml \
              down --volumes --remove-orphans || true
          done
          rm -rf "$STORAGE_SNAPSHOT_DIR"

      # The rehearsal records and the audit manifests, whatever the verdict:
      # a refused gate's account of why it was refused is the evidence a
      # release decision most needs to read.
      - name: Upload container rehearsal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: container-rehearsal-evidence-${{ github.sha }}
          path: rehearsal-evidence/
          if-no-files-found: error
