name: Client

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "infrastructure/**"
      - "scripts/**"
      - "solidity/**"
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for workflow execution"
        required: false
        default: "dev"
      upstream_builds:
        description: "Upstream builds"
        required: false
      upstream_ref:
        description: "Git reference to checkout (e.g. branch name)"
        required: false
        default: "main"

# Automatic releases are now handled by the dedicated release.yml workflow

permissions:
  contents: read
  pull-requests: read

jobs:
  client-detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './!((docs|infrastructure|scripts|solidity)/**)'

  electrum-integration-detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      path-filter: ${{ steps.filter.outputs.path-filter }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            path-filter:
              - './config/_electrum_urls/**'
              - './pkg/bitcoin/electrum/**'

  client-build-test-publish:
    needs: client-detect-changes
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The multi-arch client binary build exhausts the default ~14GB free
        # on ubuntu-latest. Reclaim ~30GB by removing preinstalled toolchains
        # we don't use.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          # Fetch the whole history for the `git describe` command to work.
          fetch-depth: 0

      - name: Resolve versions
        run: |
          echo "version=$(git describe --tags --match "v[0-9]*" HEAD)" >> $GITHUB_ENV
          echo "revision=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Load environment variables
        uses: keep-network/ci/actions/load-env-variables@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          environment: ${{ github.event.inputs.environment }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Build Image
        uses: docker/build-push-action@v5
        with:
          target: build-docker
          tags: go-build-env
          build-args: |
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          load: true # load image to local registry to use it in next steps
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          context: .

      # Since build-push-action doesn't support outputing an image to multiple outputs
      # we need to save it in a separate step. See: https://github.com/moby/buildkit/issues/1555
      # Once multiple outputs are supported we can replace this step with
      # `outputs` property configured in `Build Docker Build Image`:
      #   outputs: |
      #      type=image
      #      type=docker,dest=/tmp/go-build-env-image.tar
      - name: Save Docker Build Image
        run: |
          docker save --output /tmp/go-build-env-image.tar go-build-env

      - name: Upload Docker Build Image
        uses: actions/upload-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp/go-build-env-image.tar

      - name: Run Go tests
        run: |
          mkdir -p ${{ github.workspace }}/coverage
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            -v ${{ github.workspace }}/coverage:/coverage \
            go-build-env \
            gotestsum -- -timeout 15m -coverprofile=/coverage/coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage/coverage.out
          if-no-files-found: warn


      # The Tier-2 interceptor relies on a mutex to let a stateful Strategy run
      # under concurrent Sends without a data race; TestStrategyConcurrentStatefulNoRace
      # only has teeth under the race detector. Scoped to the fast, deterministic
      # interception/byzantine packages (dkgtest is excluded: its real-DKG goroutines
      # and wall-clock windows are timeout-amplified by -race).
      - name: Run Go race tests (Tier-2 interceptor)
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            go test -race -timeout 15m \
              ./pkg/internal/interception/... \
              ./pkg/internal/byzantine/...

      - name: Build Docker Runtime Image
        if: github.event_name != 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          target: runtime-docker
          labels: |
            version=${{ env.version }}
            revision=${{ env.revision }}
          push: false
          context: .

      - name: Login to Google Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCR_REGISTRY_URL }}
          username: _json_key
          password: ${{ secrets.KEEP_TEST_GCR_JSON_KEY }}

      - name: Build and publish Docker Runtime Image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        env:
          IMAGE_NAME: "keep-client"
        with:
          target: runtime-docker
          tags: |
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.version }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.environment }}
            ${{ env.GCR_REGISTRY_URL }}/${{ env.GOOGLE_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.version }}-${{ github.event.inputs.environment }}
          labels: |
            version=${{ env.version }}
            revision=${{ env.revision }}
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          push: true
          context: .

      - name: Build Client Binaries
        uses: docker/build-push-action@v5
        with:
          target: output-bins
          outputs: type=local,dest=./out/bin/
          build-args: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ env.version }}
            REVISION=${{ env.revision }}
          push: false
          context: .

      - name: Archive Client Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            out/bin/*.tar.gz
            out/bin/*.md5
            out/bin/*.sha256

      - name: Publish Client Binaries
        if: github.event_name == 'workflow_dispatch'
        uses: thesis/gcp-storage-bucket-action@v3.1.0
        with:
          service-key: ${{ secrets.KEEP_TEST_CLIENT_BINARIES_UPLOADER_SERVICE_KEY_JSON_BASE64 }}
          # TODO: Change to keep-prd-210b once mainnet setup is done and we are sure we want to publish mainnet builds automatically.
          project: keep-test-f3e0
          bucket-name: keep-test-client-binaries
          bucket-path: ${{ github.event.inputs.environment }}/${{ env.version }}
          build-folder: out/bin

      - name: Notify CI about completion of the workflow
        if: github.event_name == 'workflow_dispatch'
        uses: keep-network/ci/actions/notify-workflow-completed@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          module: "github.com/keep-network/keep-core/client"
          url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          environment: ${{ github.event.inputs.environment }}
          upstream_builds: ${{ github.event.inputs.upstream_builds }}
          upstream_ref: ${{ github.event.inputs.upstream_ref }}
          version: ${{ env.version }}

      - # Temp fix - move cache instead of copying (added below step and
        # modified value of `cache-to`).
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        # Without the change some jobs were failing with `no space left on device`
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  client-scan:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          args: |
            -exclude=G115,G118
            -exclude-dir=pkg/chain/ethereum/beacon/gen
            -exclude-dir=pkg/chain/ethereum/ecdsa/gen
            -exclude-dir=pkg/chain/ethereum/threshold/gen
            -exclude-dir=pkg/chain/ethereum/tbtc/gen
            ./...

  client-format:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: gofmt
        run: |
          if [ $(gofmt -l . | wc -l) -gt 0 ]; then
            gofmt -d -e .
            exit 1
          fi

  client-vet:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go vet

  client-lint:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.0
        with:
          version: "2025.1.1"
          install-go: false
          checks: "-SA1019"

  client-golangci:
    needs: client-detect-changes
    if: |
      github.event_name == 'push'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      # Additive: hosts only the project-specific ruleguard rule that bans raw
      # indexing of a bitcoin.Transaction's Outputs/Inputs (use OutputAt/InputAt
      # instead). The existing go vet / gofmt / staticcheck / gosec jobs are
      # left intact and are not duplicated here. Config: .golangci.yml +
      # .golangci-ruleguard.rules.go.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  client-integration-test:
    needs: [client-detect-changes, electrum-integration-detect-changes, client-build-test-publish]
    if: |
      github.event_name != 'pull_request'
        || needs.client-detect-changes.outputs.path-filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      - name: Run Go Integration Tests
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            go-build-env \
            gotestsum -- -timeout 20m -tags=integration ./...

  client-race-test:
    needs: client-build-test-publish
    # Non-blocking by design: runs nightly (schedule) and on manual
    # dispatch, but is intentionally NOT a required PR check until it has
    # been green and stable for a while. The first runs on a codebase that
    # has never had the race detector enabled are expected to surface
    # latent races and timing-sensitive flakes; triage each before
    # promoting this to a required check.
    if: |
      github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Docker Build Image
        uses: actions/download-artifact@v4
        with:
          name: go-build-env-image
          path: /tmp

      - name: Load Docker Build Image
        run: |
          docker load --input /tmp/go-build-env-image.tar

      - name: Run Go tests with the race detector
        # The race detector requires cgo and a C toolchain, both present in
        # the build image (g++/gcc). It is ~2-20x slower and uses ~5-10x
        # more memory than a normal run, hence the longer timeout and why
        # this is a separate job rather than a flag on the main test step.
        # The default test scope (./...) includes the in-process protocol
        # simulations (dkgtest / entrytest / gjkr roundtrip), which is where
        # data races in concurrent protocol code actually surface.
        run: |
          docker run \
            --workdir /go/src/github.com/keep-network/keep-core \
            --env CGO_ENABLED=1 \
            go-build-env \
            gotestsum -- -race -timeout 60m

      - name: Report scheduled race-detector failure
        # A non-blocking nightly job rots red silently without this: nobody
        # watches the Actions tab. Upsert a labeled issue so failures are
        # visible and triaged before this job is promoted to a required
        # check. Manual (workflow_dispatch) runs are excluded — the person
        # who dispatched them is already watching.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const label = "race-detector-failure";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;
            const body =
              `The scheduled \`-race\` test job failed.\n\n` +
              `Run: ${runUrl}\n\n` +
              `Triage the race report before promoting the job to a ` +
              `required PR check.`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Nightly race-detector run failed",
                labels: [label],
                body,
              });
            }
