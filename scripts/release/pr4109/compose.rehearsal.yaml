# Exact-image rehearsal fleet shell for the single-release cutover and
# homogeneous rollback rehearsals: an immutable prior-production node and two
# immutable R1 nodes sharing one rehearsal chain, each with a persistent
# keystore/work volume so restarts and rollback state audits are meaningful.
# It deliberately contains no chain service: the rehearsals run against a
# dedicated rehearsal chain with deployed beacon/tBTC contracts, supplied via
# ETH_WS_URL, because a throwaway in-compose chain without those contracts
# cannot produce release evidence.
#
# Required environment (validated by rehearse.sh preflight):
#   PRIOR_IMAGE_DIGEST      immutable prior-production runtime digest
#   R1_IMAGE_DIGEST         immutable R1 candidate runtime digest
#   ETH_WS_URL              rehearsal chain websocket endpoint
#   CUTOVER_BLOCK           rehearsed cutover block C (non-mainnet override)
#   KEYSTORE_DIR            per-node rehearsal inputs, one subdirectory per
#                           service; each holds that node's config.toml (with
#                           the rehearsal contract addresses, the key file
#                           path under /mnt/keystore, and storage directory
#                           /mnt/storage) plus the operator key file
#   KEEP_ETHEREUM_PASSWORD  operator key file password for the fleet
#
# Two networks separate the two reachability concerns. `rehearsal` is the
# internal inter-node protocol network — evidence probes attach here, and no
# node port is ever published to the host, including each node's client-info
# port. `chain-egress` exists only because the rehearsal chain endpoint lives
# outside this compose project; an internal-only topology would leave every
# node unable to reach ETH_WS_URL.
#
# The prior node receives no cutover configuration: the prior binary has no
# gate, which is exactly the straggler behavior the rehearsal must observe.
# It also keeps the default stop grace: without a lifecycle controller it
# exits on the first SIGTERM, so a long grace would only imply drain
# semantics the prior binary does not have.
#
# Both R1 nodes carry the release manifest's service-manager termination
# grace as their stop_grace_period: the rollback rehearsal stops R1 nodes
# mid-protocol, and Docker's 10-second default would SIGKILL a draining node
# long before its in-process backstop, so no rehearsal could ever evidence
# natural completion or the audited forced-cancellation path. The value is
# pinned to release-manifest.json by `go test ./cmd/ -run TestReleaseManifest`.

services:
  prior-node:
    image: "${PRIOR_IMAGE_DIGEST}"
    command:
      - "start"
      - "--config"
      - "/mnt/keystore/config.toml"
      - "--ethereum.url"
      - "${ETH_WS_URL}"
    environment:
      KEEP_ETHEREUM_PASSWORD: "${KEEP_ETHEREUM_PASSWORD}"
    volumes:
      - "${KEYSTORE_DIR}/prior-node:/mnt/keystore:ro"
      - "prior-node-storage:/mnt/storage"
    networks:
      - rehearsal
      - chain-egress

  r1-node-1:
    image: "${R1_IMAGE_DIGEST}"
    stop_grace_period: 20160s
    command:
      - "start"
      - "--config"
      - "/mnt/keystore/config.toml"
      - "--ethereum.url"
      - "${ETH_WS_URL}"
      - "--protocolParticipation.cutoverBlock"
      - "${CUTOVER_BLOCK}"
    environment:
      KEEP_ETHEREUM_PASSWORD: "${KEEP_ETHEREUM_PASSWORD}"
    volumes:
      - "${KEYSTORE_DIR}/r1-node-1:/mnt/keystore:ro"
      - "r1-node-1-storage:/mnt/storage"
    networks:
      - rehearsal
      - chain-egress

  r1-node-2:
    image: "${R1_IMAGE_DIGEST}"
    stop_grace_period: 20160s
    command:
      - "start"
      - "--config"
      - "/mnt/keystore/config.toml"
      - "--ethereum.url"
      - "${ETH_WS_URL}"
      - "--protocolParticipation.cutoverBlock"
      - "${CUTOVER_BLOCK}"
    environment:
      KEEP_ETHEREUM_PASSWORD: "${KEEP_ETHEREUM_PASSWORD}"
    volumes:
      - "${KEYSTORE_DIR}/r1-node-2:/mnt/keystore:ro"
      - "r1-node-2-storage:/mnt/storage"
    networks:
      - rehearsal
      - chain-egress

volumes:
  prior-node-storage:
  r1-node-1-storage:
  r1-node-2-storage:

networks:
  rehearsal:
    internal: true
  chain-egress: {}
