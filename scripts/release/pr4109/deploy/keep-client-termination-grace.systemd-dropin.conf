# systemd drop-in configuring the service-manager termination grace for a
# keep-client unit running the cutover release.
#
# TimeoutStopSec is termination_grace_period_seconds from
# ../release-manifest.json: the client's in-process quiesce backstop
# (19800 s — the compiled maximum legacy completion bound plus the reviewed
# margin, converted at the reviewed upper block interval, plus the
# RPC/processing allowance) plus the reviewed forced-cancellation allowance
# (300 s) plus the process-exit headroom (60 s) for the controller
# scheduling, quiesce and close calls, logging, and teardown that run
# outside both in-process timers — systemd counts this timeout from SIGTERM
# delivery, before either timer arms. Without it the systemd default
# (typically 90 s) SIGKILLs a draining node hours before already-started
# protocol work can complete and before the audited forced-cancellation
# path runs.
#
# The grace is a ceiling, not a wait: a node whose drain completes exits
# immediately. KillSignal stays SIGTERM because that is the signal the
# client's lifecycle controller quiesces on; systemd escalates to SIGKILL
# only after TimeoutStopSec.
#
# Install as:
#   /etc/systemd/system/<keep-client-unit>.service.d/50-termination-grace.conf
# then reload:
#   systemctl daemon-reload
#
# `go test ./cmd/ -run TestReleaseManifest` rejects this file whenever its
# value stops matching the validated release manifest; regenerate the
# manifest with `keep-client release-manifest derive` and re-review both
# together.
[Service]
TimeoutStopSec=20160
KillSignal=SIGTERM
