# ClusterFuzzLite project configuration. For CFLite only `language` is required;
# it is consumed by the build_fuzzers / run_fuzzers GitHub Actions.
#
# (A proposed OSS-Fuzz integration for the public upstream repo would live in
# google/oss-fuzz under projects/keep-core/ and carry additional fields —
# homepage, primary_contact, main_repo, auto_ccs. See README.md.)
language: go
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
